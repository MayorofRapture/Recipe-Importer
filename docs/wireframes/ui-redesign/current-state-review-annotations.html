<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review workspace — current-state annotations</title>
<style>
  :root { color-scheme: light; font: 16px/1.45 system-ui, sans-serif; color: #202c2b; background: #f4f4f0; }
  body { margin: 0; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; }
  .note { max-width: 80ch; color: #485653; }
  .grid { display: grid; gap: 24px; margin-top: 24px; }
  figure { margin: 0; background: white; border: 1px solid #bcc5c1; border-radius: 8px; overflow: hidden; }
  figcaption { padding: 12px 16px; font-weight: 650; }
  .screen { position: relative; background: #e7e8e3; }
  img { display: block; width: 100%; height: auto; }
  .mark { position: absolute; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
    color: white; background: #9a3f21; border: 2px solid white; box-shadow: 0 1px 5px #0006; font-weight: 750; }
  .annotations { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; padding: 12px 16px 18px; }
  .annotations p { margin: 0; }
  .annotations b { color: #9a3f21; }
  .missing { padding: 20px; background: #fff3d4; }
  @media (min-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
<body>
  <h1>Review workspace — current rendered state</h1>
  <p class="note">Captured 2026-10-25 in isolated synthetic Chromium at device scale factor 1. Fixture attestation and local output-path captions are temporarily hidden in the screenshot capture; the app state is otherwise unchanged.</p>
  <main class="grid">
    <figure>
      <figcaption>1440×900 · desktop editing</figcaption>
      <div class="screen"><img src="evidence/ux0-review-1440x900.png" alt="Review workspace rendered at 1440 by 900">
        <span class="mark" style="left:5%;top:21%">2</span><span class="mark" style="right:5%;bottom:8%">5</span>
      </div>
      <div class="annotations"><p><b>2.</b> Queue/navigation stack consumes first-view height.</p><p><b>5.</b> Save fits; Approve is below the first viewport.</p></div>
    </figure>
    <figure>
      <figcaption>1920×1080 · wide desktop</figcaption>
      <div class="screen"><img src="evidence/ux0-review-1920x1080.png" alt="Review workspace rendered at 1920 by 1080">
        <span class="mark" style="left:5%;top:21%">2</span>
      </div>
      <div class="annotations"><p><b>2.</b> Same stack is less costly when the viewport is taller; both actions fit.</p></div>
    </figure>
    <figure>
      <figcaption>768×900 · tablet-width view</figcaption>
      <div class="screen"><img src="evidence/ux0-review-768x900.png" alt="Review workspace rendered at 768 by 900">
        <span class="mark" style="left:3%;top:39%">3</span>
      </div>
      <div class="annotations"><p><b>3.</b> Source/editor panes are both narrow while remaining side by side.</p></div>
    </figure>
    <figure>
      <figcaption>320×900 · menu expanded during keyboard navigation</figcaption>
      <div class="screen"><img src="evidence/ux0-review-320x900.png" alt="Review workspace rendered at 320 by 900">
        <span class="mark" style="left:4%;top:5%">4</span>
      </div>
      <div class="annotations"><p><b>4.</b> The named menu exposes Review by keyboard. The open menu squeezes and clips the source/editor; switching destinations and collapsing the menu is required to work at this width.</p></div>
    </figure>
  </main>
</body>
</html>

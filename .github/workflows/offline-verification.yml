name: Offline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'

      - name: Create fresh virtual environment and install verified lock
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Compile project Python
        shell: pwsh
        run: >-
          .\.venv\Scripts\python.exe -m compileall -q
          -x '(^|[\\/])(\.git|\.venv|\.agents|\.test-tmp|output)([\\/]|$)' .

      - name: Verify CLI help without credentials
        shell: pwsh
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: .\.venv\Scripts\python.exe import_recipes.py --help

      - name: Run offline unit and AppTest suite
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'recipe-importer-tests'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          $env:TMPDIR = $testTemp
          $env:PYTHON_DOTENV_DISABLED = '1'
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Check browser harness syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path tools, tests -Filter '*.mjs' -File -Recurse
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run synthetic fixture runner tests
        shell: pwsh
        run: node --test tests/browser_fixture_runner.test.mjs

      - name: Set up a fresh synthetic browser fixture
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ("recipe-importer-fixture-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          $runId = [guid]::NewGuid().ToString()
          $nonce = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')
          .\.venv\Scripts\python.exe tools/browser_fixture_setup.py $fixtureRoot review $runId $nonce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $fixtureRoot -Recurse -Force
